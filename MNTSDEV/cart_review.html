<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>Cart Review - Pablo's Peri Peri</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    body {
      background: #ffffff !important;
    }
  </style>
</head>

<body>
  <header class="header navbar navbar-expand-lg navbar-light">
    <div class="container-fluid px-3">
      <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
        <div class="logo-container">
          <img src="logo.jpg" alt="Pablo's Peri Peri Logo" class="logo">
          <div class="brand-name">PABLO'S<br>PERI PERI</div>
        </div>
      </a>
      <button class="navbar-toggler mobile-menu-toggle d-lg-none" type="button" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse justify-content-end" id="primaryNav">
        <div class="nav-icons d-flex align-items-center gap-2 ms-lg-3">
          <div class="nav-icon home-icon" title="Home" onclick="goHome()">
            <i class="fas fa-home"></i>
          </div>
          <div class="nav-icon menu-icon" title="Menu" onclick="goToMenu()">
            <i class="fas fa-utensils"></i>
          </div>
          <div class="nav-icon cart-icon" title="Cart" onclick="goToCart()">
            <i class="fas fa-shopping-bag"></i>
            <span class="cart-badge">0</span>
          </div>
          <div class="nav-icon profile-icon" title="Profile" id="profileButton">
            <i class="fas fa-user-circle profile-icon-only" id="profileIcon"></i>
            <span class="profile-text" id="profileText">Sign In</span>
            <div class="profile-dropdown" id="profileDropdown">
              <div class="profile-dropdown-header">
                <div class="profile-meta">
                  <span class="profile-name" id="profileName">Your Account</span>
                  <span class="profile-email" id="profileEmail">user@example.com</span>
                </div>
              </div>
              <a href="account.html" class="profile-item profile-manage-account"><span>Manage account</span></a>
              <a href="orders.html" class="profile-item"><span>Orders</span></a>
              <a href="help.html" class="profile-item"><span>Help & support</span></a>
              <div class="profile-divider"></div>
              <button class="profile-item logout" id="logoutBtn" style="width:100%; background:none; border:none; text-align:left; cursor:pointer;">
                <i class="fas fa-arrow-right-from-bracket"></i><span>Log out</span>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main class="main-container">
    <div class="cart-review-container">
      <div class="cart-header">
        <div class="cart-title-section">
          <h2 class="cart-title">Your Order</h2>
          <p class="cart-subtitle">Review your items before checkout</p>
        </div>
        <div class="cart-status">
          <div class="status-indicator active">
            <i class="fas fa-shopping-cart"></i>
            <span>Cart</span>
          </div>
          <div class="status-line"></div>
          <div class="status-indicator">
            <i class="fas fa-credit-card"></i>
            <span>Payment</span>
          </div>
        </div>
      </div>

      <div class="cart-items-list">
        <!-- Cart items will be injected dynamically -->
      </div>

      <div class="cart-summary">
        <div class="summary-header">
          <h3 class="summary-title">Order Summary</h3>
        </div>
        <div class="summary-items" id="summaryItems">
          <!-- Filled dynamically from cart items -->
        </div>
      </div>

      <div class="action-buttons">
        <button class="add-more-btn" onclick="addMoreItems()">
          <i class="fas fa-plus"></i>
          <span>Add More Items</span>
        </button>
        <button class="proceed-btn" onclick="proceedToCheckout()">
          <span>Proceed to Checkout</span>
        </button>
      </div>
    </div>
  </main>

  <script type="module" src="firebase-init.js"></script>
  <script src="profile-auth.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/firestore.js"></script>
  <script src="js/cart-review.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script src="js/mobile-menu.js"></script>

  <!-- Mobile Menu Tray -->
  <div class="mobile-menu-overlay"></div>
  <div class="mobile-menu-tray">
    <div class="mobile-menu-header">
      <div class="logo-container">
        <img src="logo.jpg" alt="Pablo's Peri Peri Logo" class="logo">
        <div class="brand-name">PABLO'S<br>PERI PERI</div>
      </div>
      <button class="mobile-menu-close" aria-label="Close menu">
        <i class="fas fa-times"></i>
      </button>
    </div>
    <div class="mobile-menu-content">
      <ul class="mobile-menu-nav">
        <li class="mobile-menu-nav-item">
          <a href="index.html" class="mobile-menu-nav-link">
            <i class="fas fa-home"></i>
            <span style="margin-left: 12px;">Home</span>
          </a>
        </li>
        <li class="mobile-menu-nav-item">
          <a href="menu.html" class="mobile-menu-nav-link">
            <i class="fas fa-utensils"></i>
            <span style="margin-left: 12px;">Menu</span>
          </a>
        </li>
        <li class="mobile-menu-nav-item">
          <a href="account.html" class="mobile-menu-nav-link">
            <i class="fas fa-user-circle"></i>
            <span style="margin-left: 12px;">Account</span>
          </a>
        </li>
        <li class="mobile-menu-nav-item">
          <a href="orders.html" class="mobile-menu-nav-link">
            <i class="fas fa-receipt"></i>
            <span style="margin-left: 12px;">Orders</span>
          </a>
        </li>
        <li class="mobile-menu-nav-item">
          <a href="help.html" class="mobile-menu-nav-link">
            <i class="fas fa-question-circle"></i>
            <span style="margin-left: 12px;">Help & Support</span>
          </a>
        </li>
      </ul>
    </div>
    <div class="mobile-menu-actions">
      <a href="#" class="mobile-menu-action-btn" onclick="goToCart(); return false;">
        <i class="fas fa-shopping-bag"></i>
        <span>View Cart</span>
      </a>
      <button class="mobile-menu-action-btn secondary" id="mobileSignInBtn" onclick="window.location.href='login.html';">
        <i class="fas fa-sign-in-alt"></i>
        <span>Sign In</span>
      </button>
    </div>
  </div>
</body>
</html>
