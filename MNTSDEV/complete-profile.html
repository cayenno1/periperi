<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
    <title>Complete Profile - Pablo's Peri Peri</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script type="module" src="js/firebase-init.js"></script>
    <script src="js/site-enhancements.js" defer></script>
    <script src="js/utils.js" defer></script>
    <script src="js/auth.js" defer></script>
    <script src="js/complete-profile.js" defer></script>
</head>
<body class="restaurant-login-body">
    <!-- Header -->
    <header class="header navbar navbar-expand-lg">
        <div class="container-fluid px-3">
            <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
                <div class="logo-container">
                    <img src="logo.jpg" alt="Pablo's Peri Peri Logo" class="logo">
                    <div class="brand-name">PABLO'S<br>PERI PERI</div>
                </div>
            </a>
        </div>
    </header>

    <div class="header-banner">
        <div class="banner-content">
            <i class="fas fa-fire banner-icon"></i>
            <span>Tara na sa Pablo's Maiba naman!</span>
        </div>
    </div>

    <!-- Main Content -->
    <div class="restaurant-auth-container container py-5">
        <div class="restaurant-auth-card mx-auto">
            <div class="restaurant-auth-header">
                <h1 class="restaurant-auth-title">Complete Your Profile</h1>
                <p class="restaurant-auth-subtitle">Please add your name and phone number to continue.</p>
            </div>

            <div class="profile-email-row" id="profileEmailRow" style="display:none;">
                Signed in as <span id="profileEmail" class="profile-email-value"></span>
                <div class="profile-email-actions">
                    <span class="profile-provider-badge" id="profileProviderBadge" style="display:none;">
                        <i class="fab fa-google"></i>
                        <span>Google account</span>
                    </span>
                </div>
            </div>

            <form class="restaurant-auth-form" id="completeProfileForm">
                <div class="row g-3">
                    <div class="restaurant-form-group col-12 col-md-6">
                        <label for="firstName" class="restaurant-form-label">First Name <span style="color:#e53935;">*</span></label>
                        <input type="text" id="firstName" name="firstName" class="restaurant-form-input w-100" placeholder="Enter first name" required>
                        <span class="error-message" id="firstNameError"></span>
                    </div>
                    <div class="restaurant-form-group col-12 col-md-6">
                        <label for="lastName" class="restaurant-form-label">Last Name <span style="color:#e53935;">*</span></label>
                        <input type="text" id="lastName" name="lastName" class="restaurant-form-input w-100" placeholder="Enter last name" required>
                        <span class="error-message" id="lastNameError"></span>
                    </div>
                </div>

                <div class="restaurant-form-group">
                    <label for="phone" class="restaurant-form-label">Phone Number <span style="color:#e53935;">*</span></label>
                    <input type="tel" id="phone" name="phone" class="restaurant-form-input" placeholder="Enter phone number" required>
                    <span class="error-message" id="phoneError"></span>
                </div>

                <button type="submit" class="restaurant-auth-button" id="submitButton">
                    <span id="submitButtonText">Save & Continue</span>
                    <i class="fas fa-arrow-right"></i>
                </button>
            </form>

            <div class="restaurant-auth-footer">
                <p><a href="index.html" class="restaurant-auth-link">Back to Home</a></p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-Yvpcrf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
